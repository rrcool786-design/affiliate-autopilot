name: Daily Click Report

on:
  schedule:
    - cron: '30 16 * * *'   # 10:00 PM IST (16:30 UTC) — end of day report
  workflow_dispatch:          # manual trigger

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run click report
        env:
          TRACKER_URL:         ${{ secrets.TRACKER_URL }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python click_report.py

      - name: Save hot_products.json
        uses: actions/upload-artifact@v4
        with:
          name: hot-products-${{ github.run_id }}
          path: hot_products.json
          retention-days: 7
        continue-on-error: true
