name: Affiliate Autopilot — 10x/day Telegram Posts

on:
  schedule:
    # IST times (UTC = IST - 5:30)
    - cron: '30 1 * * *'   # 07:00 IST
    - cron: '0 3 * * *'    # 08:30 IST
    - cron: '30 4 * * *'   # 10:00 IST
    - cron: '0 6 * * *'    # 11:30 IST
    - cron: '30 7 * * *'   # 13:00 IST
    - cron: '0 9 * * *'    # 14:30 IST
    - cron: '30 10 * * *'  # 16:00 IST
    - cron: '0 12 * * *'   # 17:30 IST
    - cron: '30 13 * * *'  # 19:00 IST
    - cron: '30 15 * * *'  # 21:00 IST

  workflow_dispatch:  # Manual trigger bhi possible

# Ek waqt pe sirf EK post run chalega. Do run saath chal gaye to dono
# ek hi purani history padhkar same product post kar sakte the.
concurrency:
  group: telegram-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # posted_asins.json wapas commit karne ke liye
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openai requests beautifulsoup4

      - name: Run auto-post
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python post_once.py

      # Runner har run ke baad mit jaata hai. Agar ye file wapas repo mein
      # commit na ho, to agle run ko kuch yaad hi nahi rahega — aur wahi
      # product dobara post ho jayega.
      - name: Save post history
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_asins.json
          if git diff --staged --quiet; then
            echo "posted_asins.json mein koi change nahi — commit ki zaroorat nahi"
            exit 0
          fi
          git commit -m "Post history update — $(date +'%d %b %Y %H:%M')"
          # Website bot bhi isi branch pe commit karta hai, to rebase karke retry
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; echo "rebase fail (try $i)"; sleep 5; continue; }
            if git push origin HEAD:main; then
              echo "Post history save ho gayi"
              exit 0
            fi
            echo "push fail (try $i) — dobara koshish"
            sleep 5
          done
          echo "::error::posted_asins.json save nahi ho payi — agla run duplicate post kar sakta hai"
          exit 1
